# Sobe o RabbitMQ (Message Broker) da Entrega 3.
# Uso:  docker compose up -d        Para derrubar:  docker compose down
#   Porta 5672  = AMQP, usada pelos tres servicos
#   Porta 15672 = painel de administracao (usuario guest, senha guest)
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: acesso-coletivo-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      # Guarda filas e mensagens duraveis entre reinicios do container.
      - rabbitmq_dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_dados:
